name: Archicad Add-On Build Check

on:
  # Pushes to main only: a pull request's branch is built by its
  # pull_request run, and building it on push as well doubled every run.
  push:
    branches: [main]
  pull_request:
  # Started by claude_bot_pr_steward.yml for the pull requests the issue bot
  # opens: their pushes are made with GITHUB_TOKEN, which starts no push or
  # pull_request run, but a workflow_dispatch it sends does run, on the bot's
  # branch, and its checks show on the pull request.
  workflow_dispatch:
    inputs:
      archicad:
        description: 'Archicad versions to build, e.g. "30" or "27 28 29 30", or "all"'
        default: '30'
        type: string
      windows:
        description: 'Build the Windows add-ons too'
        default: false
        type: boolean

# A newer push to the same pull request or branch supersedes a run still
# queued or building; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generate_docs:
    # The weekly release regenerates docs/archicad-addon with this script;
    # running it here reports schema code it cannot evaluate on the PR that
    # adds it instead of at release time.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Generate the docs
      run: python3 tools/generate_addon_docs.py

  # The Archicad versions to build, from archicad-addon/devkits.json (the one
  # list of supported versions; tools/devkits.py validates it). By default only
  # Archicad 30 for macOS; a workflow_dispatch can ask for more.
  devkits:
    runs-on: ubuntu-latest
    outputs:
      win: ${{ steps.list.outputs.win }}
      mac: ${{ steps.list.outputs.mac }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Read the DevKit list
      id: list
      env:
        ARCHICAD: ${{ inputs.archicad || '30' }}
        WINDOWS: ${{ inputs.windows && 'true' || 'false' }}
      run: |
        pick() {
          python3 tools/devkits.py matrix "$1" | jq -c --arg want "$ARCHICAD" '
            if ($want | test("^ *all *$"; "i")) then .
            else ($want | [scan("[0-9]+") | tonumber]) as $v | map(select(.acVersion as $a | any($v[]; . == $a)))
            end'
        }
        mac=$(pick MAC)
        if [ "$mac" = '[]' ]; then
          echo "::error::No Archicad version in devkits.json matches \"$ARCHICAD\"."
          exit 1
        fi
        if [ "$WINDOWS" = true ]; then win=$(pick WIN); else win='[]'; fi
        echo "macOS: $(jq -c 'map(.acVersion)' <<< "$mac"), Windows: $(jq -c 'map(.acVersion)' <<< "$win")"
        echo "win=$win" >> "$GITHUB_OUTPUT"
        echo "mac=$mac" >> "$GITHUB_OUTPUT"

  build_win:
    needs: devkits
    if: needs.devkits.outputs.win != '[]'
    strategy:
      fail-fast: false
      matrix:
        params: ${{ fromJSON(needs.devkits.outputs.win) }}
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project <AC29
      if: matrix.params.acVersion < 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v142" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Generate Project >=AC29
      if: matrix.params.acVersion >= 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v143" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Win
        path: archicad-addon/Build/RelWithDebInfo/RenzoArchicad_AC${{ matrix.params.acVersion }}_Win.apx

  build_mac:
    needs: devkits
    strategy:
      fail-fast: false
      matrix:
        params: ${{ fromJSON(needs.devkits.outputs.mac) }}
    runs-on: ${{ matrix.params.acVersion < 26 && 'macos-15-intel' || 'macos-latest' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python3 archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Xcode" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Create zip file
      run: ditto -c -k --keepParent archicad-addon/Build/RelWithDebInfo/RenzoArchicad_AC${{ matrix.params.acVersion }}_Mac.bundle archicad-addon/Build/RelWithDebInfo/RenzoArchicad_AC${{ matrix.params.acVersion }}_Mac.zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Mac
        path: archicad-addon/Build/RelWithDebInfo/RenzoArchicad_AC${{ matrix.params.acVersion }}_Mac.zip
